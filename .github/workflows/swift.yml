name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build debug configuration
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run tests
        run: |
          set -o pipefail
          swift test -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/fluentkit-tests.log"
          python3 tools/check_test_diagnostics.py "$RUNNER_TEMP/fluentkit-tests.log"

      - name: Build release configuration
        run: swift build --configuration release -Xswiftc -warnings-as-errors

      - name: Check release rendering and input work counts
        run: ./tools/run-quality-checks.sh "$RUNNER_TEMP/fluentkit-audit"
